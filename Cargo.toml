[package]
name = "l402_middleware"
version = "2.3.4"
description = "A middleware library for rust that provides handler functions to accept microtransactions before serving ad-free content or any paid APIs."
readme = "README.md"
documentation = "https://docs.rs/l402_middleware"
repository = "https://github.com/DhananjayPurohit/l402_middleware"
homepage = "https://github.com/DhananjayPurohit/l402_middleware"
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
base64 = "0.21.5"
bitcoin = "0.32.3"
bytes = "1.11.1"
chacha20poly1305 = "0.10"
cln-rpc = "0.4.0"
dotenvy = "0.15"
futures-util = "0.3"
hex = "0.4.3"
lightning = "0.2.2"
lightning-invoice = "0.34.0"
macaroon = "0.3.0"
nwc = "0.45"
prost = "0.14"
reqwest = { version = "0.12.7", features = ["json"] }
rocket = { version = "0.5.0-rc.3", features = ["json"], optional = true }

serde = "1.0.210"
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1", features = ["net", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
# rustls, webpki-roots removed as we are reverting to insecure for debugging
# rustls = "0.22"
# webpki-roots = "0.26"
tonic = "0.14"
tokio-socks = "0.5.0"
tokio-openssl = "0.6.0"
openssl = "0.10.72"
tower = "0.5"
hyper-util = { version = "0.1", features = ["tokio"] }
http = "1.0"
uuid = { version = "1.12.1", features = ["v4"] }
x25519-dalek = "2.0"
secp256k1 = "0.28"
pbkdf2 = "0.12"
hmac = "0.12"
snow = "0.9"
rand = "0.8"
hkdf = "0.12"
scrypt = "0.11"
k256 = "0.13"
tonic-prost = "0.14"

[features]
default = ["rocket"]
no-accept-authenticate-required = []
# Rocket integration (Fairing, request guards, demo server). Library consumers
# that only call the handler functions (e.g. ngx_l402) can build with
# default-features = false and drop rocket/hyper 0.14/h2 0.3 from their tree.
rocket = ["dep:rocket"]

[[bin]]
name = "l402_middleware"
path = "src/main.rs"
required-features = ["rocket"]
