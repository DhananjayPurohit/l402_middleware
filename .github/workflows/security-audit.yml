name: Security Audit

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Re-run weekly so newly-disclosed advisories are caught even without a push.
    - cron: '0 6 * * 1'

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        # Audit the dependency tree against the RustSec advisory database.
        # No advisories are ignored: rocket 0.5.2 moved to hyper 1.x, which
        # took the unpatchable h2 0.3 line (RUSTSEC-2026-0258) out of the tree.
        run: cargo audit
